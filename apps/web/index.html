<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d12" />
    <meta
      name="description"
      content="WebPoB — 100% pure TypeScript web port of Path of Building for Path of Exile 1 (3.30) & Path of Exile 2 (0.5) with full English & Simplified Chinese support. 流放之路 1 & 2 纯前端中文/英文在线构筑模拟器。"
    />
    <meta property="og:title" content="WebPoB — Path of Building for Web (PoE 1 & PoE 2)" />
    <meta
      property="og:description"
      content="Pure TypeScript Path of Building web planner for PoE 1 (3.30) & PoE 2 (0.5) — 60fps Passive Tree, Full DPS, Multi-Spec/ItemSet/SkillSet, EN/ZH-CN bilingual."
    />
    <meta property="og:type" content="website" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23111521'/><path d='M32 10 L50 22 L44 48 L32 54 L20 48 L14 22 Z' fill='%23f59e0b' fill-opacity='0.22' stroke='%23f59e0b' stroke-width='3'/><text x='32' y='40' text-anchor='middle' font-size='22' font-family='sans-serif' font-weight='bold' fill='%23fde68a'>P</text></svg>"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>WebPoB — Path of Building for Web (PoE 1 & PoE 2)</title>
  </head>
  <body class="bg-[#0b0d12] text-zinc-100 antialiased selection:bg-amber-500/30 selection:text-amber-200">
    <div id="root">
      <div style="height:100vh;width:100vw;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#0b0d12;color:#e4e4e7;font-family:system-ui,-apple-system,sans-serif">
        <div style="width:44px;height:44px;border-radius:999px;border:3px solid rgba(245,158,11,.22);border-top-color:#f59e0b;animation:wp-spin .85s linear infinite"></div>
        <div id="wp-boot-title" style="font-size:15px;font-weight:700;letter-spacing:.3px;color:#fde68a">WebPoB · Path of Building for Web</div>
        <div id="wp-boot-sub" style="font-size:12px;color:#a1a1aa">Loading passive tree &amp; calc engine (cached locally after first load)…</div>
        <style>@keyframes wp-spin{to{transform:rotate(360deg)}}</style>
        <script>
          (function(){
            try {
              var q = new URLSearchParams(location.search).get('lang') || '';
              var saved = '';
              try { saved = (JSON.parse(localStorage.getItem('webpob_state_v1') || '{}') || {}).locale || ''; } catch(e){}
              var nav = (navigator.languages && navigator.languages[0]) || navigator.language || '';
              var isZh = /^zh(?:$|[-_])/i.test(q) || (!/^en(?:$|[-_])/i.test(q) && (saved ? saved === 'zh-CN' : /^zh(?:$|[-_])/i.test(nav)));
              document.documentElement.lang = isZh ? 'zh-CN' : 'en';
              if (isZh) {
                var t = document.getElementById('wp-boot-title');
                var s = document.getElementById('wp-boot-sub');
                if (t) t.textContent = 'WebPoB · 流放之路网页版模拟器';
                if (s) s.textContent = '正在加载天赋树与计算引擎（首次加载后自动本地缓存秒开）…';
              }
            } catch(e) {}
          })();
        </script>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
